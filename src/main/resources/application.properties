spring.application.name=bookshelf

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookshelf}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bookshelf}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bookshelf}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.enabled=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.example.bookshelf=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

jwt.secret=${JWT_SECRET:bookshelf-dev-secret-key-min-32-chars!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
